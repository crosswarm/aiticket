        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .markdown-body h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #1e293b;
        }

        .markdown-body h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            color: #334155;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }

        .markdown-body h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.25rem;
            margin-bottom: 0.75rem;
            color: #475569;
        }

        .markdown-body p {
            margin-bottom: 1rem;
            color: #64748b;
            line-height: 1.7;
        }

        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
            color: #64748b;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid #e2e8f0;
            padding: 0.75rem;
            text-align: left;
        }

        .markdown-body th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: #475569;
        }

        /* Chart Height Fix */
        .chart-container {
            position: relative;
            height: 300px;
            /* Constrain height */
            width: 100%;
        }

        /* Hide scrollbar but keep functionality */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* === Report Sidebar List Items === */
        .ds-report-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            width: 100%;
            text-align: left;
            padding: 0.625rem 0.75rem;
            border-radius: var(--ds-radius-md);
            font-size: var(--ds-text-sm);
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: background var(--ds-transition-fast), border-color var(--ds-transition-fast);
            background: transparent;
            border-top: none; border-right: none; border-bottom: none;
        }
        .ds-report-item:hover {
            background: var(--ds-bg-muted);
        }
        .ds-report-item--active {
            background: var(--ds-accent-subtle);
            border-left-color: var(--ds-accent);
        }
        .ds-report-item--active:hover {
            background: var(--ds-accent-subtle);
        }
        .ds-report-item-title {
            font-weight: var(--ds-font-medium);
            color: var(--ds-text-primary);
        }
        .ds-report-item--active .ds-report-item-title {
            color: var(--ds-accent-text);
        }
        .ds-report-item-sub {
            font-size: var(--ds-text-xs);
            color: var(--ds-text-muted);
        }
        .ds-report-item-meta {
            font-size: var(--ds-text-xs);
            color: var(--ds-text-secondary);
        }
        .ds-report-item-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.375rem;
        }
        .ds-report-action {
            font-size: var(--ds-text-xs);
            padding: 0.125rem 0.5rem;
            border-radius: var(--ds-radius-sm);
            transition: background var(--ds-transition-fast), color var(--ds-transition-fast);
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .ds-report-action--danger {
            color: var(--ds-danger-text);
        }
        .ds-report-action--danger:hover {
            background: var(--ds-danger-subtle);
        }
        .ds-report-action--primary {
            color: var(--ds-accent-text);
        }
        .ds-report-action--primary:hover {
            background: var(--ds-accent-subtle);
        }

        /* Mobile Responsive Styles */
        @media screen and (max-width: 768px) {
            body {
                font-size: 14px;
            }

            .markdown-body h1 {
                font-size: 1.5rem;
            }

            .markdown-body h2 {
                font-size: 1.25rem;
            }

            .markdown-body h3 {
                font-size: 1.1rem;
            }

            .markdown-body table {
                font-size: 13px;
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            .markdown-body th,
            .markdown-body td {
                padding: 0.5rem;
            }

            .chart-container {
                height: 200px;
            }

            /* 侧边栏在移动端隐藏为 overlay（由 responsive.css .report-sidebar 控制） */

            /* 主内容区在移动端全宽 */
            .report-main {
                margin-left: 0 !important;
                width: 100% !important;
            }

            /* 玻璃效果在移动端简化 */
            .glass {
                backdrop-filter: none;
                background: rgba(255, 255, 255, 0.98);
            }
        }

        /* Print & PDF Export Styles - 简化版 */
        @media print {
            /* 只隐藏不需要打印的 UI 元素 */
            .no-print,
            nav,
            .bg-slate-900,
            .fixed,
            button:not(.print-btn) {
                display: none !important;
            }

            /* 确保背景色和颜色正确打印 */
            body {
                background: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* 内容区域样式 */
            #reportContainer {
                overflow: visible !important;
                height: auto !important;
                padding: 20px !important;
                max-width: 100% !important;
            }

            /* 玻璃效果简化 */
            .glass {
                box-shadow: none !important;
                border: 1px solid #e2e8f0 !important;
                background: white !important;
            }
        }

        /* PDF Export specific styles - 简化版 */
        .pdf-export-mode .no-print,
        .pdf-export-mode nav,
        .pdf-export-mode button {
            display: none !important;
        }

        .pdf-export-mode body {
            background: white !important;
        }

        .pdf-export-mode .glass {
            box-shadow: none !important;
            border: 1px solid #e2e8f0 !important;
            background: white !important;
        }

        body.print-view {
            display: block !important;
            height: auto !important;
            overflow: visible !important;
            background: white !important;
        }

        body.print-view .bg-slate-900,
        body.print-view #floatingHeaderActions,
        body.print-view #report-task-panel,
        body.print-view footer {
            display: none !important;
        }

        body.print-view .fixed {
            position: static !important;
        }

        body.print-view #reportContainer {
            padding: 12mm !important;
            overflow: visible !important;
            background: white !important;
        }

        body.print-view #reportContent {
            max-width: none !important;
        }

        body.print-view .glass {
            break-inside: avoid;
            page-break-inside: avoid;
        }
    </style>

<body class="overflow-hidden">

<!-- 侧边栏 -->
<aside id="ds-sidebar" class="ds-sidebar"></aside>

    <div id="report-sidebar-overlay" class="report-sidebar-overlay" onclick="toggleReportSidebar()"></div>
    <!-- Sidebar -->
    <div id="report-sidebar" class="report-sidebar w-64 flex flex-col shadow-xl z-20" style="background:var(--ds-bg-surface);border-right:1px solid var(--ds-border)">
        <div class="p-5 border-b" style="border-color:var(--ds-border)">
            <h1 class="text-lg font-bold flex items-center gap-2" style="color:var(--ds-text-primary)">
                <i data-lucide="bar-chart-2" class="w-5 h-5" style="color:var(--ds-accent)"></i>
                报告控制
            </h1>

            <!-- Report Type Toggle -->
            <div class="mt-4 flex rounded-lg p-1" style="background:var(--ds-bg-muted)">
                <button onclick="switchReportType('weekly')" id="weeklyTab"
                    class="flex-1 py-1.5 px-3 rounded text-sm font-medium transition" style="background:var(--ds-accent);color:white">
                    周报
                </button>
                <button onclick="switchReportType('monthly')" id="monthlyTab"
                    class="flex-1 py-1.5 px-3 rounded text-sm font-medium transition" style="color:var(--ds-text-muted)">
                    月报
                </button>
            </div>

            <!-- Generate Button -->
            <button onclick="showCsvSelectModal()" id="genBtn"
                class="mt-4 w-full py-2 rounded-lg flex items-center justify-center gap-2 text-sm font-medium transition" style="background:var(--ds-accent);color:white">
                <i data-lucide="sparkles" class="w-4 h-4"></i> <span id="genBtnText">生成周报</span>
            </button>

            <!-- Refresh Button -->
            <button onclick="loadReportList()" id="refreshBtn"
                class="mt-2 w-full py-2 rounded-lg flex items-center justify-center gap-2 text-sm font-medium transition" style="background:var(--ds-bg-muted);color:var(--ds-text-secondary)">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> <span>刷新列表</span>
            </button>

            <div id="report-task-panel"
                class="hidden mt-3 rounded-xl border p-3 text-sm shadow-lg" style="border-color:var(--ds-accent);background:var(--ds-accent-subtle);color:var(--ds-text-primary)">

                        </div>
                        <div id="report-task-status" class="mt-2 text-xs text-slate-300">等待启动</div>
                    </div>
                    <button id="report-task-cancel-btn" onclick="cancelCurrentTask(event)"
                        class="hidden rounded bg-rose-500/90 px-2 py-1 text-xs font-medium text-white hover:bg-rose-500">
                        取消
                    </button>
                </div>
                <div class="mt-3 h-2 overflow-hidden rounded-full bg-slate-700">
                    <div id="report-task-progress-bar"
                        class="h-full rounded-full bg-indigo-500 transition-all duration-300"

                </div>
                <div class="mt-2 flex items-center justify-between text-xs text-slate-400">
                    <span id="report-task-message">任务未启动</span>
                    <span id="report-task-progress">0%</span>
                </div>
                <div id="report-task-error" class="mt-2 hidden text-xs text-rose-300"></div>
            </div>
        </div>

        <div id="scope-banner" class="hidden mx-4 sm:mx-6 mt-1.5 flex items-center gap-2 px-3 py-1.5 bg-indigo-50 border border-indigo-100 rounded-lg text-xs text-indigo-700">
            <svg class="w-3.5 h-3.5 text-indigo-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-.293.707L11 11.414V15a1 1 0 01-.553.894l-4 2A1 1 0 015 17v-5.586L3.293 5.707A1 1 0 013 5V3z" clip-rule="evenodd"/></svg>
            <span id="scope-banner-text"></span>
            <a href="board.html" class="ml-1 text-indigo-500 hover:underline">修改作用域</a>
        </div>
        <!-- Mobile Report Panel Toggle -->
        <button id="report-sidebar-toggle" onclick="toggleReportSidebar()"
            class="show-mobile-only fixed top-14 left-3 z-30 rounded-lg px-3 py-1.5 flex items-center gap-1.5 text-sm transition"
            style="background:var(--ds-bg-surface);color:var(--ds-text-secondary);border:1px solid var(--ds-border);box-shadow:var(--ds-shadow-lg)"
            aria-label="打开报告面板">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
            <span>报告面板</span>
        </button>
        <!-- Floating Header Actions -->
        <div id="floatingHeaderActions" class="absolute top-14 right-3 sm:right-8 flex gap-2 sm:gap-3 z-10 flex-wrap justify-end">
            <!-- Export Format Selection -->
            <div class="hidden sm:flex bg-white rounded-lg shadow-lg border border-slate-200 p-1 items-center gap-1">
                <label class="px-2 py-1 text-xs text-slate-500 font-medium">导出格式:</label>
                <label class="flex items-center gap-1 px-2 py-1 hover:bg-slate-50 rounded cursor-pointer">
                    <input type="checkbox" id="export-md" value="md" checked class="w-3 h-3 text-indigo-600 rounded">
                    <span class="text-xs text-slate-600">MD</span>
                </label>
                <label class="flex items-center gap-1 px-2 py-1 hover:bg-slate-50 rounded cursor-pointer">
                    <input type="checkbox" id="export-docx" value="docx" class="w-3 h-3 text-indigo-600 rounded">
                    <span class="text-xs text-slate-600">Word</span>
                </label>
                <label class="flex items-center gap-1 px-2 py-1 hover:bg-slate-50 rounded cursor-pointer">
                    <input type="checkbox" id="export-pdf" value="pdf" class="w-3 h-3 text-indigo-600 rounded">
                    <span class="text-xs text-slate-600">PDF</span>
                </label>
                <label class="flex items-center gap-1 px-2 py-1 hover:bg-slate-50 rounded cursor-pointer">
                    <input type="checkbox" id="export-xlsx" value="xlsx" class="w-3 h-3 text-indigo-600 rounded">
                    <span class="text-xs text-slate-600">Excel</span>
                </label>
            </div>

            <button onclick="exportReport()" id="exportBtn"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 transition text-sm font-medium">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span id="exportBtnText">导出</span>
            </button>

            <button onclick="copyReportShareLink()"
                class="bg-white hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg shadow-lg border border-slate-200 flex items-center gap-2 transition text-sm font-medium"
                title="复制分享链接">
                <i data-lucide="link" class="w-4 h-4"></i> 复制链接
            </button>

            <button onclick="openPrintPreview()"
                class="bg-white hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg shadow-lg border border-slate-200 flex items-center gap-2 transition text-sm font-medium">
                <i data-lucide="printer" class="w-4 h-4"></i> 打印
            </button>
        </div>

        <!-- Scrollable Report Area -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-8 bg-slate-50" id="reportContainer">
            <div class="max-w-5xl mx-auto space-y-8" id="reportContent">
                <!-- Welcome State -->
                <div class="text-center mt-20">
                    <div class="inline-block p-4 rounded-full bg-indigo-50 mb-4">
                        <i data-lucide="pie-chart" class="w-12 h-12 text-indigo-500"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">请选择左侧周报进行查看</h2>
                    <p class="text-slate-500 mt-2">系统将自动加载可视化图表及AI定性分析结果。</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/lib-loader.js"></script>
    <script src="/assets/vendor/marked.min.js"></script>
    <script src="/assets/vendor/chart.min.js"></script>
    <script src="/assets/vendor/lucide.min.js"></script>
    <script src="/assets/common.js"></script>
    <script>
        // Safe Lucide initialization helper
        function safeCreateIcons() {
            if (typeof lucide !== 'undefined' && lucide !== null && typeof lucide.createIcons === 'function') {
                try {
                    lucide.createIcons();
                } catch (e) {
                    console.warn('[Report] Lucide createIcons failed:', e);
                }
            }
        }

        async function ensureHtml2PdfReady() {
            if (typeof html2pdf !== 'undefined') {
                return html2pdf;
            }

            await loadLibrary('html2pdf');
            return html2pdf;
        }

        // Initialize Lucide icons with error handling
        safeCreateIcons();
        console.log('[Report] Lucide icons initialized successfully');

        // Report Type State
        let currentReportType = 'weekly'; // 'weekly' or 'monthly'
        let currentReportData = null;
        const reportPageParams = new URLSearchParams(window.location.search);
        const isPrintView = reportPageParams.get('print') === '1';

        function _getBoardScope() {
            try {
                const store = JSON.parse(localStorage.getItem('board_filter_v1') || '{}');
                return {
                    project_key: store.project?.value || 'MYPROJECT',
                    project_label: store.project?.label || 'MYPROJECT',
                    domain_modules: store.domain_modules || []
                };
            } catch { return { project_key: 'MYPROJECT', project_label: 'MYPROJECT', domain_modules: [] }; }
        }

        function _initScopeBanner() {
            const scope = _getBoardScope();
            const banner = document.getElementById('scope-banner');
            const text = document.getElementById('scope-banner-text');
            if (!banner || !text) return;
            const mods = scope.domain_modules;
            if (mods.length > 0) {
                banner.classList.remove('hidden');
                text.textContent = `当前作用域: ${scope.project_key} · ${mods.join(' + ')}`;
            } else if (scope.project_key && scope.project_key !== 'MYPROJECT') {
                banner.classList.remove('hidden');
                text.textContent = `当前作用域: ${scope.project_key} · 全部模块`;
            }
        }
        const initialReportType = reportPageParams.get('type') || 'weekly';
        const _rawId = reportPageParams.get('id');
        const initialReportId = _rawId && !_rawId.endsWith('.json') ? _rawId + '.json' : _rawId;
        window.__REPORT_PRINT_READY__ = false;

        function resetPrintReady() {
            window.__REPORT_PRINT_READY__ = false;
        }

        function markPrintReady() {
            if (!isPrintView) {
                return;
            }

            window.setTimeout(() => {
                window.__REPORT_PRINT_READY__ = true;
            }, 400);
        }

        function openPrintPreview() {
            if (!currentSelectedReport.id) {
                showToast('请先选择要打印的报告', 'error');
                return;
            }

            const printUrl = new URL(window.location.href);
            printUrl.searchParams.set('print', '1');
            printUrl.searchParams.set('type', currentSelectedReport.type);
            printUrl.searchParams.set('id', currentSelectedReport.id);
            window.open(printUrl.toString(), '_blank', 'noopener,noreferrer');
        }

        // Switch Report Type
        function copyReportShareLink() {
            if (!currentSelectedReport.id) {
                showToast('请先选择报告', 'error');
                return;
            }
            const shareId = (currentSelectedReport.id || '').replace(/\.json$/, '');
            const url = `${window.location.origin}${window.location.pathname}?type=${currentSelectedReport.type}&id=${encodeURIComponent(shareId)}`;
            navigator.clipboard.writeText(url).then(
                () => showToast('链接已复制', 'success'),
                () => showToast('复制失败，请手动复制地址栏', 'error')
            );
        }

        function switchReportType(type) {
            currentReportType = type;

            // Update Tab UI
            const weeklyTab = document.getElementById('weeklyTab');
            const monthlyTab = document.getElementById('monthlyTab');
            const genBtnText = document.getElementById('genBtnText');

            if (type === 'weekly') {
                weeklyTab.className = 'flex-1 py-1.5 px-3 rounded text-sm font-medium transition';
                weeklyTab.style.cssText = 'background:var(--ds-accent);color:white';
                monthlyTab.className = 'flex-1 py-1.5 px-3 rounded text-sm font-medium transition';
                monthlyTab.style.cssText = 'color:var(--ds-text-muted);background:transparent';
                genBtnText.textContent = '生成最新周报';
            } else {
                weeklyTab.className = 'flex-1 py-1.5 px-3 rounded text-sm font-medium transition';
                weeklyTab.style.cssText = 'color:var(--ds-text-muted);background:transparent';
                monthlyTab.className = 'flex-1 py-1.5 px-3 rounded text-sm font-medium transition';
                monthlyTab.style.cssText = 'background:var(--ds-accent);color:white';
                genBtnText.textContent = '生成月报';
            }

            // Reload List
            _initScopeBanner();
            loadReportList();
        }

        // Generate Current Report (Weekly or Monthly)
        async function generateCurrentReport() {
            if (currentReportType === 'weekly') {
                await generateWeeklyReport();
            } else {
                await generateMonthlyReport();
            }
        }

        // 0. Generate Weekly Report Logic
        async function generateWeeklyReport() {
            const btn = document.getElementById('genBtn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="animate-spin">↻</span> 生成中...';
            btn.disabled = true;

            // Get Config from LocalStorage (Shared with index.html)
            const provider = localStorage.getItem('llm_last_provider') || 'gemini';
            const configStr = localStorage.getItem(`llm_config_${provider}`);
            const _ws = _getBoardScope();

            let payload = {
                api_key: "",
                provider: provider,
                model_name: "",
                base_url: "",
                project_key: _ws.project_key,
                domain_modules: _ws.domain_modules
            };

            if (configStr) {
                try {
                    const config = JSON.parse(configStr);
                    payload.api_key = config.apiKey || "";
                    payload.model_name = config.modelName || "";
                    payload.base_url = config.baseUrl || "";
                } catch (e) { }
            }

            try {
                const res = await fetch(`${API_BASE}/api/generate_report`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    await loadReportList(); // Reload list
                } else {
                    const err = await res.json();
                    alert('生成失败: ' + (err.detail || 'Unknown Error'));
                }
            } catch (e) {
                alert('请求失败: ' + e.message);
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }

        // Generate Monthly Report Logic
        async function generateMonthlyReport() {
            const btn = document.getElementById('genBtn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="animate-spin">↻</span> 生成中...';
            btn.disabled = true;

            const now = new Date();
            const payload = {
                year: now.getFullYear(),
                month: now.getMonth() + 1,
                api_key: "",
                provider: "gemini",
                model_name: "",
                base_url: ""
            };

            // Try to get config from localStorage
            const provider = localStorage.getItem('llm_last_provider') || 'gemini';
            const configStr = localStorage.getItem(`llm_config_${provider}`);

            if (configStr) {
                try {
                    const config = JSON.parse(configStr);
                    payload.api_key = config.apiKey || "";
                    payload.provider = provider;
                    payload.model_name = config.modelName || "";
                    payload.base_url = config.baseUrl || "";
                } catch (e) { }
            }

            try {
                const res = await fetch(`${API_BASE}/api/generate_monthly_report`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    await loadReportList(); // Reload list
                } else {
                    const err = await res.json();
                    alert('生成失败: ' + (err.detail || 'Unknown Error'));
                }
            } catch (e) {
                alert('请求失败: ' + e.message);
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }

        // 1. Load Report List
        async function loadReportList() {
            if (currentReportType === 'weekly') {
                await loadWeeklyReportList();
            } else {
                await loadMonthlyReportList();
            }
        }

        // Load Weekly Report List
        async function loadWeeklyReportList() {
            try {
                const { project_key: _rpk, domain_modules: _rdm } = _getBoardScope();
                const _rdmParam = _rdm.length > 0 ? `&domain_modules=${encodeURIComponent(_rdm.join(','))}` : '';
                const res = await fetch(`${API_BASE}/api/reports?project_key=${encodeURIComponent(_rpk)}${_rdmParam}`);
                const reports = await res.json();
                const listEl = document.getElementById('reportObjList');
                listEl.innerHTML = "";

                if (reports.length === 0) {
                    listEl.innerHTML = '<div class="text-slate-500 text-sm text-center">暂无周报</div>';
                    return;
                }

                const targetReportParam = initialReportId || reportPageParams.get('report');
                let paramReportLoaded = false;
                reports.forEach((report, index) => {
                    const isTarget = targetReportParam && report.filename === targetReportParam;
                    const btn = document.createElement('button');
                    btn.className = 'ds-report-item' + (isTarget || (!targetReportParam && index === 0) ? ' ds-report-item--active' : '');
                    const dateDisplay = report.date;
                    btn.innerHTML = `
                        <span class="ds-report-item-title">周报 ${dateDisplay}</span>
                        <span class="ds-report-item-sub">${report.filename}</span>
                    `;
                    btn.onclick = () => loadWeeklyReport(report.filename, btn);
                    listEl.appendChild(btn);

                    if (isTarget) {
                        paramReportLoaded = true;
                        loadWeeklyReport(report.filename, btn);
                    } else if (index === 0 && !targetReportParam) {
                        loadWeeklyReport(report.filename, btn);
                    }
                });
                if (targetReportParam && !paramReportLoaded && reports.length > 0) {
                    const firstBtn = listEl.querySelector('button');
                    if (firstBtn) firstBtn.click();
                }
            } catch (e) {
                console.error("Failed to load list", e);
                document.getElementById('reportObjList').innerHTML = '<div class="text-rose-400 text-sm text-center">加载失败</div>';
            }
        }

        // Load Monthly Report List
        async function loadMonthlyReportList() {
            try {
                const res = await fetch(`${API_BASE}/api/monthly_reports`);
                const reports = await res.json();
                const listEl = document.getElementById('reportObjList');
                listEl.innerHTML = "";

                if (reports.length === 0) {
                    listEl.innerHTML = '<div class="text-slate-500 text-sm text-center">暂无月报<br><span class="text-xs">点击上方按钮生成</span></div>';
                    return;
                }

                const targetMonthlyParam = initialReportId;
                let paramMonthlyLoaded = false;
                reports.forEach((report, index) => {
                    const isTarget = targetMonthlyParam && report.filename === targetMonthlyParam;
                    const btn = document.createElement('button');
                    btn.className = 'ds-report-item' + (isTarget || (!targetMonthlyParam && index === 0) ? ' ds-report-item--active' : '');
                    btn.innerHTML = `
                        <span class="ds-report-item-title">${report.period}</span>
                        <span class="ds-report-item-sub">${report.filename}</span>
                    `;
                    btn.onclick = () => loadMonthlyReport(report.filename, btn);
                    listEl.appendChild(btn);

                    if (isTarget) {
                        paramMonthlyLoaded = true;
                        loadMonthlyReport(report.filename, btn);
                    } else if (index === 0 && !targetMonthlyParam) {
                        loadMonthlyReport(report.filename, btn);
                    }
                });
                if (targetMonthlyParam && !paramMonthlyLoaded && reports.length > 0) {
                    const firstBtn = listEl.querySelector('button');
                    if (firstBtn) firstBtn.click();
                }
            } catch (e) {
                console.error("Failed to load monthly list", e);
                document.getElementById('reportObjList').innerHTML = '<div class="text-rose-400 text-sm text-center">加载失败</div>';
            }
        }

        let charts = [];

        // Load Weekly Report
        async function loadWeeklyReport(filename, btnElement) {
            resetPrintReady();
            if (btnElement) {
                document.querySelectorAll('#reportObjList button').forEach(b => {
                    b.classList.remove('ds-report-item--active');
                });
                btnElement.classList.add('ds-report-item--active');
            }

            // Update current selected report for export
            currentSelectedReport = { type: 'weekly', id: filename };
            if (!isPrintView) {
                history.replaceState(null, '', `${window.location.pathname}?type=weekly&id=${encodeURIComponent(filename.replace(/\.json$/, ''))}`);
            }

            try {
                const res = await fetch(`${API_BASE}/api/reports/${filename}`);
                const data = await res.json();
                currentReportData = data;
                renderWeeklyReport(data);
                markPrintReady();
            } catch (e) {
                console.error(e);
                document.getElementById('reportContent').innerHTML = `<div class="text-rose-500">无法加载报告内容: ${e.message}</div>`;
            }
        }

        // Load Monthly Report
        async function loadMonthlyReport(filename, btnElement) {
            resetPrintReady();
            if (btnElement) {
                document.querySelectorAll('#reportObjList button').forEach(b => {
                    b.classList.remove('ds-report-item--active');
                });
                btnElement.classList.add('ds-report-item--active');
            }

            // Update current selected report for export
            currentSelectedReport = { type: 'monthly', id: filename };
            if (!isPrintView) {
                history.replaceState(null, '', `${window.location.pathname}?type=monthly&id=${encodeURIComponent(filename.replace(/\.json$/, ''))}`);
            }

            try {
                const res = await fetch(`${API_BASE}/api/monthly_reports/${filename}`);
                const data = await res.json();
                currentReportData = data;
                renderMonthlyReport(data);
                markPrintReady();
            } catch (e) {
                console.error(e);
                document.getElementById('reportContent').innerHTML = `<div class="text-rose-500">无法加载月报内容: ${e.message}</div>`;
            }
        }

        // Legacy loadReport function (for backwards compatibility)
        async function loadReport(filename, btnElement) {
            // Update Active State
            if (btnElement) {
                document.querySelectorAll('#reportObjList button').forEach(b => {
                    b.classList.remove('ds-report-item--active');
                });
                btnElement.classList.add('ds-report-item--active');
            }

            // Fetch Data
            try {
                const res = await fetch(`${API_BASE}/api/reports/${filename}`);
                const data = await res.json();
                renderReport(data);
            } catch (e) {
                console.error(e);
                document.getElementById('reportContent').innerHTML = `<div class="text-rose-500">无法加载报告内容: ${e.message}</div>`;
            }
        }

        // Render Weekly Report Content
        function renderWeeklyReport(data) {
            const container = document.getElementById('reportContent');

            // Destroy old charts to prevent duplicate canvases
            charts.forEach(c => c.destroy());
            charts = [];

            const meta = data.meta || {};
            const dataPeriod = meta.data_start_date && meta.data_end_date
                ? `${meta.data_start_date} 至 ${meta.data_end_date}`
                : meta.period || '未知';

            // Template using Charts and Markdown
            container.innerHTML = `
                <!-- Title & Meta -->
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-slate-800 mb-2">周总结分析报告</h1>
                    <div class="flex flex-wrap gap-4 text-sm text-slate-500">
                        <span class="bg-indigo-50 px-2 py-1 rounded">数据周期: ${dataPeriod}</span>
                        <span>生成时间: ${meta.generated_at || ''}</span>
                        <span>文件源: ${meta.filename || ''}</span>
                    </div>
                </div>

                <!-- Key Metrics Cards -->
                ${(() => {
                    const kpi = data.kpi_analysis || {};
                    const cur = kpi.current || {};
                    const ytd = kpi.ytd || {};
                    const baseline = kpi.baseline_per_customer || 4.21;
                    const target = kpi.target || 3.37;
                    const ytdDensity = ytd.per_customer || '-';
                    const ytdStr = typeof ytdDensity === 'number' ? ytdDensity.toFixed(2) : ytdDensity;
                    const gapVal = typeof ytdDensity === 'number' ? (ytdDensity - target) : null;
                    const gapStr = gapVal !== null ? (gapVal <= 0 ? `<span class="text-emerald-600">${gapVal.toFixed(2)} 达标</span>` : `<span class="text-red-600">+${gapVal.toFixed(2)} 未达标</span>`) : '-';
                    return `
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-8">
                    <div class="glass p-5 rounded-xl shadow-sm border-t-4 border-indigo-500">
                        <p class="text-xs font-medium text-slate-500 uppercase">工单总数</p>
                        <p class="text-2xl font-bold text-indigo-700 mt-1">${meta.total_tickets || 0}</p>
                        <p class="text-xs text-slate-400 mt-1">含转出 ${meta.count_transferred || 0}</p>
                    </div>
                    <div class="glass p-5 rounded-xl shadow-sm border-t-4 border-emerald-500">
                        <p class="text-xs font-medium text-slate-500 uppercase">流程中心核心</p>
                        <p class="text-2xl font-bold text-emerald-700 mt-1">${meta.count_process || 0}</p>
                    </div>
                    <div class="glass p-5 rounded-xl shadow-sm border-t-4 border-amber-500">
                        <p class="text-xs font-medium text-slate-500 uppercase">转出工单</p>
                        <p class="text-2xl font-bold text-amber-700 mt-1">${meta.count_transferred || 0}</p>
                        <p class="text-xs text-slate-400 mt-1">占比 ${meta.ratio_transferred ? meta.ratio_transferred.toFixed(1) : '0.0'}%</p>
                    </div>
                    <div class="glass p-5 rounded-xl shadow-sm border-t-4 border-violet-500">
                        <p class="text-xs font-medium text-slate-500 uppercase">2025基准密度</p>
                        <p class="text-2xl font-bold text-violet-700 mt-1">${baseline}</p>
                        <p class="text-xs text-slate-400 mt-1">条/客户/年</p>
                    </div>
                    <div class="glass p-5 rounded-xl shadow-sm border-t-4 border-rose-500">
                        <p class="text-xs font-medium text-slate-500 uppercase">2026 KPI目标</p>
                        <p class="text-2xl font-bold text-rose-700 mt-1">≤${target}</p>
                        <p class="text-xs text-slate-400 mt-1">同比降20%</p>
                    </div>
                    <div class="glass p-5 rounded-xl shadow-sm border-t-4 border-cyan-500">
                        <p class="text-xs font-medium text-slate-500 uppercase">年初至今密度</p>
                        <p class="text-2xl font-bold text-cyan-700 mt-1">${ytdStr}</p>
                        <p class="text-xs mt-1">${gapStr}</p>
                    </div>
                    <div class="glass p-5 rounded-xl shadow-sm border-t-4 border-teal-500">
                        <p class="text-xs font-medium text-slate-500 uppercase">本周密度</p>
                        <p class="text-2xl font-bold text-teal-700 mt-1">${cur.per_customer ? cur.per_customer.toFixed(2) : '-'}</p>
                        <p class="text-xs text-slate-400 mt-1">${cur.unique_customers || 0} 家客户</p>
                    </div>
                </div>`;
                })()}

                <!-- Charts Section -->

            return new Chart(ctx, {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: dataValues,
                        backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b'],
                        borderRadius: 4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

            const filename = `${reportType}_${reportId.replace(/\.(md|json)$/, '')}_${new Date().toISOString().slice(0, 10)}.pdf`;

            showToast('正在生成PDF...', 'info');

            // 保存原始HTML
            const originalHTML = element.innerHTML;
            const originalClasses = element.className;

            // 创建PDF专用的简化HTML

                <div style="font-family: 'Microsoft YaHei', sans-serif; font-size: 12px; line-height: 1.6; color: #333; max-width: 100%;">

            element.className = '';

            // 隐藏侧边栏
            const sidebar = document.querySelector('.bg-slate-900');
            const exportPanel = document.querySelector('.space-y-4');
            const originalSidebarDisplay = sidebar ? sidebar.style.display : '';
            const originalExportDisplay = exportPanel ? exportPanel.style.display : '';
            if (sidebar) sidebar.style.display = 'none';
            if (exportPanel) exportPanel.style.display = 'none';

            // 添加PDF样式
            const styleEl = document.createElement('style');
            styleEl.id = 'pdf-export-styles';
            styleEl.textContent = `
                #reportContent * { max-width: 750px !important; }
                #reportContent .grid { display: block !important; }
                #reportContent .grid > div { width: 100% !important; margin-bottom: 15px !important; }
                #reportContent .glass { border: 1px solid #ddd !important; background: #f9f9f9 !important; padding: 10px !important; margin-bottom: 15px !important; box-shadow: none !important; }

                #reportContent h3 { font-size: 11px !important; }

            const opt = {
                margin: [10, 10, 10, 10],

                html2canvas: {

        async function exportReport() {
            // Check if a report is selected
            if (!currentSelectedReport.id) {
                showToast('请先选择要导出的报告', 'error');
                return;
            }

            // Get selected formats
            const formats = [];
            if (document.getElementById('export-md').checked) formats.push('md');
            if (document.getElementById('export-docx').checked) formats.push('docx');
            if (document.getElementById('export-pdf').checked) formats.push('pdf');
            if (document.getElementById('export-xlsx').checked) formats.push('xlsx');

            if (formats.length === 0) {
                showToast('请至少选择一种导出格式', 'error');
                return;
            }

            // PDF 优先走后端页面级导出，保证与网页主内容一致
            if (formats.includes('pdf') && formats.length === 1) {
                return exportViaBackend(formats);
            }

            // 多格式或非PDF，走后端API
            return exportViaBackend(formats);
        }

        /**
         * 后端API导出（支持多格式）
         */
        async function exportViaBackend(formats) {

            // Update button state
            const btn = document.getElementById('exportBtn');
            const btnText = document.getElementById('exportBtnText');
            const originalText = btnText.innerText;
            btn.disabled = true;
            btnText.innerText = '导出中...';

            try {
                // Start export task
                const response = await fetch(`${API_BASE}/api/export/report`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        report_type: currentSelectedReport.type,
                        report_id: currentSelectedReport.id,
                        formats: formats
                    })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    showToast('导出任务已启动，正在处理...', 'success');
                    // Poll for task completion, pass formats for status tracking
                    pollExportStatus(data.task_id, formats);
                } else {
                    showToast('导出失败: ' + (data.detail || '未知错误'), 'error');
                    btn.disabled = false;
                    btnText.innerText = originalText;
                }
            } catch (error) {
                console.error('Export error:', error);
                showToast('导出请求失败: ' + error.message, 'error');
                btn.disabled = false;
                btnText.innerText = originalText;
            }
        }

        async function pollExportStatus(taskId, requestedFormats) {
            const btn = document.getElementById('exportBtn');
            const btnText = document.getElementById('exportBtnText');

            const checkStatus = async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/export/status/${taskId}`);
                    const data = await response.json();

                    if (!response.ok) {
                        showToast('获取导出状态失败', 'error');
                        btn.disabled = false;
                        btnText.innerText = '导出';
                        return;
                    }

                    if (data.status === 'completed') {
                        const successCount = data.output_files.length;
                        const totalRequested = requestedFormats.length;
                        let message = `导出完成！成功 ${successCount}/${totalRequested} 个文件`;
                        if (data.message && data.message.includes('失败')) {
                            message = data.message;
                        }
                        showToast(message, successCount > 0 ? 'success' : 'warning');
                        btn.disabled = false;
                        btnText.innerText = '导出';
                        // Show download links and auto-download
                        showDownloadLinks(data.output_files, taskId, successCount === 1);
                    } else if (data.status === 'failed') {
                        showToast('导出失败: ' + (data.error_message || '未知错误'), 'error');
                        btn.disabled = false;
                        btnText.innerText = '导出';
                    } else {
                        // Still running, poll again
                        btnText.innerText = `${data.progress}%`;
                        setTimeout(checkStatus, 1000);
                    }
                } catch (error) {
                    console.error('Poll error:', error);
                    btn.disabled = false;
                    btnText.innerText = '导出';
                }
            };

            checkStatus();
        }

        function showDownloadLinks(files, taskId, autoDownload = false) {
            // Create a temporary download area
            const container = document.getElementById('reportContent');
            const downloadDiv = document.createElement('div');
            downloadDiv.className = 'glass p-6 rounded-xl shadow-lg mb-6 bg-gradient-to-r from-indigo-50 to-purple-50';
            downloadDiv.id = 'download-area';

            let filesHtml = files.map(file => {
                const ext = file.split('.').pop().toLowerCase();
                let icon = '📄';
                let color = 'bg-slate-100 text-slate-700';
                if (ext === 'md') { icon = '📝'; color = 'bg-blue-100 text-blue-700'; }
                else if (ext === 'docx') { icon = '📘'; color = 'bg-indigo-100 text-indigo-700'; }

        // --- Delete and Regenerate Functions ---

        async function deleteReport(filename, type) {
            if (!confirm(`确定要删除报告 "${filename}" 吗？\n\n此操作不可恢复！`)) return;

            const endpoint = type === 'weekly'
                ? `/api/reports/${encodeURIComponent(filename)}`
                : `/api/monthly_reports/${encodeURIComponent(filename)}`;

            try {
                const res = await fetch(`${API_BASE}${endpoint}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('报告已删除', 'success');
                    // 刷新列表
                    loadReportList();
                } else {
                    const err = await res.json();
                    showToast('删除失败: ' + (err.detail || '未知错误'), 'error');
                }
            } catch (e) {
                showToast('删除失败: ' + e.message, 'error');
            }
        }

        async function regenerateReport(filename, type) {
            if (!confirm(`确定要重新生成报告 "${filename}" 吗？\n\n这将覆盖现有报告。`)) return;

            if (type === 'weekly') {
                // 周报：从CSV重新生成
                await generateWeeklyReport(null, true);
            } else {
                // 月报：从filename解析年月并重新生成
                // filename格式: Monthly_Report_YYYYMM_YYYY-MM-DD_YYYY-MM-DD.json 或 Monthly_Report_YYYYMM.json
                const yearMatch = filename.match(/Monthly_Report_(\d{4})/);
                const monthMatch = filename.match(/Monthly_Report_\d{4}(\d{2})/);

                if (yearMatch && monthMatch) {
                    const year = parseInt(yearMatch[1]);
                    const month = parseInt(monthMatch[1]);
                    await generateMonthlyReport(true, year, month);
                } else {
                    alert('无法解析月报的年月信息');
                }
            }
        }

        // --- Toast Notification ---

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-rose-500' : 'bg-indigo-500';
            const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : 'info';

            toast.className = `fixed top-4 right-4 ${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 z-50 animate-fade-in`;
            toast.innerHTML = `
                <i data-lucide="${icon}" class="w-5 h-5"></i>
                <span class="font-medium">${message}</span>
            `;

            document.body.appendChild(toast);
            safeCreateIcons();

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Updated Generate Functions ---

        function getReportLLMConfig() {
            const provider = localStorage.getItem('llm_last_provider') || 'gemini';
            const configStr = localStorage.getItem(`llm_config_${provider}`);

            const payload = {
                api_key: "",
                provider,
                model_name: "",
                base_url: ""
            };

            if (configStr) {
                try {
                    const config = JSON.parse(configStr);
                    payload.api_key = config.apiKey || "";
                    payload.model_name = config.modelName || "";
                    payload.base_url = config.baseUrl || "";
                } catch (e) {
                    console.warn('[Report] 解析模型配置失败:', e);
                }
            }

            return payload;
        }

        function renderReportTaskPanel(task, taskTypeLabel = '报告') {
            const panel = document.getElementById('report-task-panel');
            const titleEl = document.getElementById('report-task-title');
            const statusEl = document.getElementById('report-task-status');
            const messageEl = document.getElementById('report-task-message');
            const progressEl = document.getElementById('report-task-progress');
            const progressBarEl = document.getElementById('report-task-progress-bar');
            const errorEl = document.getElementById('report-task-error');
            const cancelBtn = document.getElementById('report-task-cancel-btn');

            const progress = Number.isFinite(task?.progress) ? task.progress : 0;
            const status = task?.status || 'pending';
            const message = task?.message || '任务等待执行';
            const title = `${taskTypeLabel}生成任务`;

            panel.classList.remove('hidden');
            titleEl.textContent = title;
            statusEl.textContent = ({
                pending: '排队中',
                running: '进行中',
                completed: '已完成',
                failed: '失败',
                cancelled: '已取消'
            })[status] || status;
            messageEl.textContent = message;
            progressEl.textContent = `${progress}%`;
            progressBarEl.style.width = `${Math.max(0, Math.min(progress, 100))}%`;
            cancelBtn.classList.toggle('hidden', !currentTaskId || !['pending', 'running'].includes(status));

            progressBarEl.classList.remove('bg-indigo-500', 'bg-emerald-500', 'bg-rose-500', 'bg-slate-500');
            if (status === 'completed') {
                progressBarEl.classList.add('bg-emerald-500');
            } else if (status === 'failed') {
                progressBarEl.classList.add('bg-rose-500');
            } else if (status === 'cancelled') {
                progressBarEl.classList.add('bg-slate-500');
            } else {
                progressBarEl.classList.add('bg-indigo-500');
            }

            if (task?.error) {
                errorEl.textContent = task.error;
                errorEl.classList.remove('hidden');
            } else {
                errorEl.textContent = '';
                errorEl.classList.add('hidden');
            }

            safeCreateIcons();
        }

        function resetReportTaskButton() {
            const btn = document.getElementById('genBtn');
            btn.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i> <span id="genBtnText">${currentReportType === 'weekly' ? '生成周报' : '生成月报'}</span>`;
            btn.disabled = false;
            safeCreateIcons();
        }

        function setReportTaskButtonProgress(progress) {
            const btn = document.getElementById('genBtn');
            const label = currentReportType === 'weekly' ? '周报' : '月报';
            btn.innerHTML = `
                <span class="animate-spin">↻</span>
                <span>${label}生成中 ${progress}%</span>
            `;
            btn.disabled = true;
        }

        async function pollReportTask(taskId, taskTypeLabel, successMessage) {
            const statusRes = await fetch(`${API_BASE}/api/report/status/${taskId}`);
            const statusData = await statusRes.json();

            renderReportTaskPanel(statusData, taskTypeLabel);
            setReportTaskButtonProgress(Number.isFinite(statusData.progress) ? statusData.progress : 0);

            if (statusData.status === 'completed') {
                currentTaskId = null;
                resetReportTaskButton();
                showToast(successMessage, 'success');
                await loadReportList();
                return;
            }

            if (statusData.status === 'failed') {
                currentTaskId = null;
                resetReportTaskButton();
                showToast('生成失败: ' + (statusData.error || 'Unknown Error'), 'error');
                return;
            }

            if (statusData.status === 'cancelled') {
                currentTaskId = null;
                resetReportTaskButton();
                showToast('任务已取消', 'info');
                return;
            }

            window.setTimeout(() => {
                pollReportTask(taskId, taskTypeLabel, successMessage).catch((error) => {
                    currentTaskId = null;
                    resetReportTaskButton();
                    renderReportTaskPanel({
                        status: 'failed',
                        progress: 0,
                        message: '任务状态查询失败',
                        error: error.message
                    }, taskTypeLabel);
                    showToast('任务状态查询失败: ' + error.message, 'error');
                });
            }, 1000);
        }

        async function startAsyncReportTask(taskType, payload, options = {}) {
            const btn = document.getElementById('genBtn');
            btn.disabled = true;

            const taskTypeLabel = options.taskTypeLabel || (taskType === 'weekly' ? '周报' : '月报');
            renderReportTaskPanel({
                status: 'pending',
                progress: 0,
                message: '正在启动任务...'
            }, taskTypeLabel);
            setReportTaskButtonProgress(0);

            const startRes = await fetch(`${API_BASE}/api/report/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    task_type: taskType,
                    ...payload
                })
            });

            const startData = await startRes.json();
            if (!startRes.ok) {
                resetReportTaskButton();
                throw new Error(startData.detail || '启动任务失败');
            }

            currentTaskId = startData.task_id;
            await pollReportTask(currentTaskId, taskTypeLabel, options.successMessage || `${taskTypeLabel}生成成功`);
        }

        async function generateWeeklyReport(csvFilename = null, force = false) {
            const btn = document.getElementById('genBtn');
            if (btn.disabled) {
                return;
            }

            const _gs = _getBoardScope();
            const payload = {
                ...getReportLLMConfig(),
                csv_filename: csvFilename,
                force: force,
                project_key: _gs.project_key,
                domain_modules: _gs.domain_modules
            };

            try {
                await startAsyncReportTask('weekly', payload, {
                    taskTypeLabel: '周报',
                    successMessage: '周报生成成功'
                });
            } catch (e) {
                resetReportTaskButton();
                renderReportTaskPanel({
                    status: 'failed',
                    progress: 0,
                    message: '周报生成任务启动失败',
                    error: e.message
                }, '周报');
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        async function generateMonthlyReport(force = false, year = null, month = null) {
            const btn = document.getElementById('genBtn');
            if (btn.disabled) {
                return;
            }

            // 使用传入的年月，或默认当前月
            const now = new Date();
            const targetYear = year || now.getFullYear();
            const targetMonth = month || (now.getMonth() + 1);

            const _gms = _getBoardScope();
            const payload = {
                year: targetYear,
                month: targetMonth,
                force: force,
                ...getReportLLMConfig(),
                project_key: _gms.project_key,
                domain_modules: _gms.domain_modules
            };

            try {
                await startAsyncReportTask('monthly', payload, {
                    taskTypeLabel: '月报',
                    successMessage: '月报生成成功'
                });
            } catch (e) {
                resetReportTaskButton();
                renderReportTaskPanel({
                    status: 'failed',
                    progress: 0,
                    message: '月报生成任务启动失败',
                    error: e.message
                }, '月报');
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        // 进度显示相关变量
        let currentTaskId = null;

        // 取消当前任务
        async function cancelCurrentTask(event) {
            if (event) event.stopPropagation();

            try {
                const res = await fetch(`${API_BASE}/api/report/cancel/${currentTaskId}`, {
                    method: 'POST'
                });
                if (res.ok) {
                    showToast('正在取消任务...', 'info');
                } else {
                    showToast('取消失败', 'error');
                }
            } catch (e) {
                console.error('[Report] 取消任务失败:', e);
            }
        }

        // --- Updated Load List Functions ---

        async function loadWeeklyReportList() {
            try {
                const res = await fetch(`${API_BASE}/api/reports`);
                const reports = await res.json();
                const listEl = document.getElementById('reportObjList');
                listEl.innerHTML = "";

                if (reports.length === 0) {
                    listEl.innerHTML = '<div class="text-slate-500 text-sm text-center">暂无周报<br><span class="text-xs">点击上方按钮生成</span></div>';
                    return;
                }

                reports.forEach((report, index) => {
                    const dataStart = report.data_start_date || '';
                    const dataEnd = report.data_end_date || '';
                    const period = report.period || (dataStart ? `${dataStart}周报` : '未知周期');
                    const displayPeriod = dataStart ? `${dataStart}周报` : period;

                    const btn = document.createElement('button');
                    btn.className = 'ds-report-item' + (index === 0 ? ' ds-report-item--active' : '');
                    btn.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="ds-report-item-title">${displayPeriod}</span>
                            <span class="ds-report-item-meta">${report.total_tickets || 0} 工单</span>
                        </div>
                        <div class="ds-report-item-sub flex items-center justify-between">
                            <span>${dataStart ? dataStart + ' 至 ' + dataEnd : '数据周期未知'}</span>
                        </div>
                        <div class="ds-report-item-actions">
                            <button onclick="event.stopPropagation(); deleteReport('${encodeURIComponent(report.filename)}', 'weekly')" class="ds-report-action ds-report-action--danger">
                                删除
                            </button>
                            <button onclick="event.stopPropagation(); showCsvSelectModal()" class="ds-report-action ds-report-action--primary">
                                重新生成
                            </button>
                        </div>
                    `;
                    btn.onclick = () => loadWeeklyReport(report.filename, btn);
                    listEl.appendChild(btn);

                    if (index === 0) loadWeeklyReport(report.filename, btn);
                });
            } catch (e) {
                console.error("Failed to load list", e);
                document.getElementById('reportObjList').innerHTML = '<div class="text-rose-400 text-sm text-center">加载失败</div>';
            }
        }

        async function loadMonthlyReportList() {
            try {
                const res = await fetch(`${API_BASE}/api/monthly_reports`);
                const reports = await res.json();
                const listEl = document.getElementById('reportObjList');
                listEl.innerHTML = "";

                if (reports.length === 0) {
                    listEl.innerHTML = '<div class="text-slate-500 text-sm text-center">暂无月报<br><span class="text-xs">点击上方按钮生成</span></div>';
                    return;
                }

                reports.forEach((report, index) => {
                    const dataPeriod = report.data_period || (report.data_start_date ? `${report.data_start_date} 至 ${report.data_end_date}` : '未知');

                    const btn = document.createElement('button');
                    btn.className = 'ds-report-item' + (index === 0 ? ' ds-report-item--active' : '');
                    btn.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="ds-report-item-title">${report.period || '未知月份'}</span>
                            <span class="ds-report-item-meta">${report.total_tickets || 0} 工单</span>
                        </div>
                        <div class="ds-report-item-sub">
                            数据周期: ${dataPeriod}
                        </div>
                        <div class="ds-report-item-actions">
                            <button onclick="event.stopPropagation(); deleteReport('${encodeURIComponent(report.filename)}', 'monthly')" class="ds-report-action ds-report-action--danger">
                                删除
                            </button>
                            <button onclick="event.stopPropagation(); regenerateReport('${encodeURIComponent(report.filename)}', 'monthly')" class="ds-report-action ds-report-action--primary">
                                重新生成
                            </button>
                        </div>
                    `;
                    btn.onclick = () => loadMonthlyReport(report.filename, btn);
                    listEl.appendChild(btn);

                    if (index === 0) loadMonthlyReport(report.filename, btn);
                });
            } catch (e) {
                console.error("Failed to load monthly list", e);
                document.getElementById('reportObjList').innerHTML = '<div class="text-rose-400 text-sm text-center">加载失败</div>';
            }
        }

        // Override switchReportType to update button text
        const originalSwitchReportType = switchReportType;
        switchReportType = function(type) {
            currentReportType = type;

            // Update Tab UI
            const weeklyTab = document.getElementById('weeklyTab');
            const monthlyTab = document.getElementById('monthlyTab');
            const genBtnText = document.getElementById('genBtnText');

            if (type === 'weekly') {
                weeklyTab.className = 'flex-1 py-1.5 px-3 rounded text-sm font-medium transition';
                weeklyTab.style.cssText = 'background:var(--ds-accent);color:white';
                monthlyTab.className = 'flex-1 py-1.5 px-3 rounded text-sm font-medium transition';
                monthlyTab.style.cssText = 'color:var(--ds-text-muted);background:transparent';
                genBtnText.textContent = '生成周报';
            } else {
                weeklyTab.className = 'flex-1 py-1.5 px-3 rounded text-sm font-medium transition';
                weeklyTab.style.cssText = 'color:var(--ds-text-muted);background:transparent';
                monthlyTab.className = 'flex-1 py-1.5 px-3 rounded text-sm font-medium transition';
                monthlyTab.style.cssText = 'background:var(--ds-accent);color:white';
                genBtnText.textContent = '生成月报';
            }

            // Update URL to reflect current tab (clear id until a report is selected)
            history.replaceState(null, '', `${window.location.pathname}?type=${type}`);

            // Reload List
            loadReportList();
        };

        // Mobile sidebar toggle
        function toggleReportSidebar() {
            var sidebar = document.getElementById('report-sidebar');
            var overlay = document.getElementById('report-sidebar-overlay');
            var isOpen = sidebar.classList.contains('sidebar-open');
            if (isOpen) {
                sidebar.classList.remove('sidebar-open');
                overlay.classList.remove('open');
                document.body.style.overflow = '';
            } else {
                sidebar.classList.add('sidebar-open');
                overlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }
        }

    </script>
