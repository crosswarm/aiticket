module_id: reply
lineage_file: APP/backend/data/reply_style_rules.md

slots:
  system_prompt_core:
    kind: markdown_section
    path: APP/backend/data/reply_prompt_core.md
    bounds: {max_chars: 6000}

  style_rules_md:
    kind: markdown_section
    path: APP/backend/data/reply_style_rules.md
    bounds: {max_chars: 8192}

  similar_issues_top_k:
    kind: numeric
    path: APP/backend/config/reply_agents.yaml
    key: agents.reply_generator.params.similar_issues_top_k
    bounds: {min: 1, max: 10}
    default: 5

  similar_issues_min_score:
    kind: numeric
    path: APP/backend/config/reply_agents.yaml
    key: agents.reply_generator.params.similar_issues_min_score
    bounds: {min: 0.4, max: 0.9}
    default: 0.6

  reply_examples_top_k:
    kind: numeric
    path: APP/backend/config/reply_agents.yaml
    key: agents.reply_generator.params.reply_examples_top_k
    bounds: {min: 1, max: 6}
    default: 5

  modified_weight_boost:
    kind: numeric
    path: APP/backend/reply_trainer.py
    key: SEARCH_EXAMPLES_MODIFIED_BOOST
    bounds: {min: 1.0, max: 2.0}
    default: 1.3

  low_score_filter:
    kind: numeric
    path: APP/backend/reply_trainer.py
    key: SEARCH_EXAMPLES_LOW_SCORE_FILTER
    bounds: {min: 0.1, max: 0.5}
    default: 0.3
