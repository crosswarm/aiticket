services:
  aiticket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiticket
    restart: unless-stopped
    # PORT 只控宿主发布端口；容器内固定 18000（见 entrypoint.sh）。
    ports:
      - "${PORT:-18000}:18000"
    env_file:
      - path: .env
        required: false
    environment:
      # 认证库落到持久 volume（/data），否则 auth 在容器临时层，
      # 每次 rebuild/recreate 都丢 admin 账号与 Jira 绑定。
      - APP_AUTH_DB_PATH=/data/app_auth.db
      - APP_AUTH_SECRET_PATH=/data/app_auth.key
    volumes:
      # 配置：镜像已内置默认 config/deployment.yaml，开箱即起。
      # 如需自定义，去掉下一行注释并在 host 准备好该文件（cp deployment.yaml.example deployment.yaml）：
      # - ./APP/backend/config/deployment.yaml:/app/APP/backend/config/deployment.yaml:ro
      - aiticket-data:/data
      - aiticket-logs:/app/logs
    healthcheck:
      # --noproxy '*'：localhost 探活绝不走代理。否则若宿主 ~/.docker/config.json
      # 配了 proxies（docker 会注入 HTTP_PROXY 到容器），健康探测会经代理失败→误报 unhealthy。
      test: ["CMD", "curl", "-fsS", "--noproxy", "*", "http://localhost:18000/api/board/stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 可选：独立 nginx 反向代理（提供 HTTPS + 静态资源）
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./APP/frontend:/var/www/aiticket/frontend:ro
  #   depends_on:
  #     - aiticket

volumes:
  aiticket-data:
  aiticket-logs:
