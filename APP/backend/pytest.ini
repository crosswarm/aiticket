[pytest]
# 测试与源码 1:1 命名：APP/backend/<module>.py ↔ APP/backend/tests/test_<module>.py
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -q 保持输出精简；--strict-markers 让拼错的 mark 直接报错而不是静默忽略。
addopts = -q --strict-markers -p no:cacheprovider

markers =
    slow: 耗时较长（涉及模型加载/大量 IO），日常可用 -m "not slow" 跳过
    integration: 需要真实外部依赖（Jira / PM / LLM），默认不在闸门里跑

# 第三方库的历史告警不该淹没我们自己的输出
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
