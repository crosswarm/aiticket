<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工单 - 账号与用户</title>
    <link rel="stylesheet" href="/assets/responsive.css">
    <link rel="stylesheet" href="/assets/ds/tokens.css">
    <link rel="stylesheet" href="/assets/ds/base.css">
    <link rel="stylesheet" href="/assets/ds/components.css">
    <link rel="stylesheet" href="/assets/ds/command-palette.css">
    <style>
        .settings-shell { max-width: 1120px; margin: 0 auto; padding: 24px 20px 56px; }
        .settings-card { background: var(--ds-bg-surface, #fff); border: 1px solid var(--ds-border, #e2e8f0); border-radius: 14px; padding: 22px; box-shadow: 0 8px 24px rgba(15,23,42,.05); }
        .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { color: var(--ds-text-secondary, #475569); font-size: 12px; font-weight: 600; }
        .field input, .field select { width: 100%; box-sizing: border-box; border: 1px solid var(--ds-border, #cbd5e1); border-radius: 8px; padding: 9px 11px; background: var(--ds-bg-surface, #fff); color: var(--ds-text-primary, #0f172a); font-size: 13px; }
        .field input:focus, .field select:focus { outline: 2px solid rgba(79,70,229,.18); border-color: #6366f1; }
        .user-table-wrap { overflow-x: auto; border: 1px solid var(--ds-border, #e2e8f0); border-radius: 10px; }
        .user-table { width: 100%; border-collapse: collapse; min-width: 720px; }
        .user-table th, .user-table td { padding: 11px 12px; border-bottom: 1px solid var(--ds-border, #e2e8f0); text-align: left; font-size: 13px; }
        .user-table th { background: var(--ds-bg-muted, #f8fafc); color: var(--ds-text-secondary, #475569); font-size: 12px; }
        .user-table tr:last-child td { border-bottom: none; }
        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
        .badge-admin { background: #ede9fe; color: #6d28d9; }
        .badge-member { background: #e0f2fe; color: #0369a1; }
        .badge-active { background: #dcfce7; color: #166534; }
        .badge-disabled { background: #fee2e2; color: #991b1b; }
        .hidden { display: none !important; }
        .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15,23,42,.55); }
        .modal-card { width: min(460px, 100%); border-radius: 14px; background: #fff; padding: 22px; box-shadow: 0 24px 70px rgba(15,23,42,.25); }
        .password-output { margin: 14px 0; padding: 12px; border: 1px dashed #818cf8; border-radius: 8px; background: #eef2ff; color: #312e81; font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
        @media (max-width: 720px) { .settings-grid { grid-template-columns: 1fr; } .settings-shell { padding: 16px 12px 40px; } }
    </style>
</head>
<body style="background:var(--ds-bg-page,#f8fafc);color:var(--ds-text-primary,#0f172a);min-height:100vh">
    <aside id="ds-sidebar" class="ds-sidebar"></aside>
    <div id="ds-sidebar-overlay" class="ds-sidebar-overlay"></div>
    <div id="ds-main" class="ds-main">
        <header class="ds-page-header">
            <div class="ds-page-header-left">
                <button class="ds-hamburger" onclick="DSSidebar.open()" aria-label="打开导航">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="ds-page-title">账号与用户</h1>
            </div>
            <div style="font-size:12px;color:var(--ds-text-muted,#64748b)">
                <span id="current-user-name">加载中...</span>
                <span id="current-user-role"></span>
            </div>
        </header>

        <main class="settings-shell">
            <section class="settings-card">
                <div style="margin-bottom:18px">
                    <h2 style="font-size:17px;font-weight:700;margin:0 0 5px">修改登录密码</h2>
                    <p style="font-size:12px;color:var(--ds-text-muted,#64748b);margin:0">修改成功后会注销现有会话，请使用新密码重新登录。</p>
                </div>
                <form id="password-form" onsubmit="changePassword(event)">
                    <div class="settings-grid">
                        <div class="field">
                            <label for="current-password">当前密码</label>
                            <input id="current-password" type="password" autocomplete="current-password" required>
                        </div>
                        <div></div>
                        <div class="field">
                            <label for="new-password">新密码（至少 10 个字符）</label>
                            <input id="new-password" type="password" minlength="10" autocomplete="new-password" required>
                        </div>
                        <div class="field">
                            <label for="confirm-password">确认新密码</label>
                            <input id="confirm-password" type="password" minlength="10" autocomplete="new-password" required>
                        </div>
                    </div>
                    <button id="change-password-btn" class="ds-btn ds-btn-primary" type="submit" style="margin-top:16px">更新密码</button>
                </form>
            </section>

            <section id="admin-user-management" class="settings-card hidden" style="margin-top:18px">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap">
                    <div>
                        <h2 style="font-size:17px;font-weight:700;margin:0 0 5px">用户管理</h2>
                        <p style="font-size:12px;color:var(--ds-text-muted,#64748b);margin:0">新增用户密码由服务端随机生成，仅显示一次。</p>
                    </div>
                    <button class="ds-btn ds-btn-primary" type="button" onclick="openCreateUserModal()">新增用户</button>
                </div>
                <div id="users-loading" style="padding:24px;text-align:center;color:var(--ds-text-muted,#64748b);font-size:13px">正在加载用户...</div>
                <div id="users-table-wrap" class="user-table-wrap hidden">
                    <table class="user-table">
                        <thead><tr><th>显示名</th><th>账号</th><th>角色</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="user-edit-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <h2 id="user-modal-title" style="font-size:16px;font-weight:700;margin:0">新增用户</h2>
                <button class="ds-btn ds-btn-ghost" type="button" onclick="closeUserModal()">关闭</button>
            </div>
            <form id="user-edit-form" onsubmit="saveUser(event)">
                <input id="edit-user-id" type="hidden">
                <div class="field" style="margin-bottom:12px">
                    <label for="edit-username">账号</label>
                    <input id="edit-username" type="text" pattern="[a-zA-Z0-9._-]+" autocomplete="off" required>
                </div>
                <div class="field" style="margin-bottom:12px">
                    <label for="edit-display-name">显示名</label>
                    <input id="edit-display-name" type="text" maxlength="80" required>
                </div>
                <div class="settings-grid">
                    <div class="field">
                        <label for="edit-role">角色</label>
                        <select id="edit-role"><option value="member">普通用户</option><option value="admin">管理员</option></select>
                    </div>
                    <div class="field" id="edit-active-field">
                        <label for="edit-active">状态</label>
                        <select id="edit-active"><option value="true">启用</option><option value="false">停用</option></select>
                    </div>
                </div>
                <button id="save-user-btn" class="ds-btn ds-btn-primary" type="submit" style="margin-top:18px;width:100%">保存</button>
            </form>
        </div>
    </div>

    <div id="password-result-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
            <h2 style="font-size:16px;font-weight:700;margin:0">一次性临时密码</h2>
            <p style="font-size:12px;color:#64748b;line-height:1.6">请立即安全地交给用户。关闭后系统不会再次显示此密码。</p>
            <div id="temporary-password" class="password-output"></div>
            <div style="display:flex;gap:8px;justify-content:flex-end">
                <button class="ds-btn ds-btn-secondary" type="button" onclick="copyTemporaryPassword()">复制密码</button>
                <button class="ds-btn ds-btn-primary" type="button" onclick="closePasswordModal()">我已保存</button>
            </div>
        </div>
    </div>

    <script src="/assets/common.js"></script>
    <script>
        let currentUser = null;
        let managedUsers = [];

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        async function readJson(response) {
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
            return data;
        }

        async function initializeSettings() {
            try {
                const data = await readJson(await fetch(API_BASE + '/api/auth/me'));
                currentUser = data.user;
                document.getElementById('current-user-name').textContent = currentUser.display_name || currentUser.username;
                document.getElementById('current-user-role').textContent = currentUser.role === 'admin' ? ' · 管理员' : ' · 普通用户';
                if (currentUser.role === 'admin') {
                    document.getElementById('admin-user-management').classList.remove('hidden');
                    await loadUsers();
                }
            } catch (error) {
                window.location.href = API_BASE + '/login.html?next=' + encodeURIComponent('/settings.html');
            }
        }

        async function changePassword(event) {
            event.preventDefault();
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            if (newPassword.length < 10) return showToast('新密码至少需要 10 个字符', 'warning');
            if (newPassword !== confirmPassword) return showToast('两次输入的新密码不一致', 'warning');
            const button = document.getElementById('change-password-btn');
            button.disabled = true;
            try {
                await readJson(await fetch(API_BASE + '/api/user/change-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-AiTicket-CSRF': '1'},
                    body: JSON.stringify({current_password: currentPassword, new_password: newPassword})
                }));
                showToast('密码已更新，请重新登录', 'success', 1200);
                setTimeout(() => { window.location.href = API_BASE + '/login.html'; }, 900);
            } catch (error) {
                showToast(error.message, 'error');
                button.disabled = false;
            }
        }

        async function loadUsers() {
            document.getElementById('users-loading').classList.remove('hidden');
            document.getElementById('users-table-wrap').classList.add('hidden');
            try {
                const data = await readJson(await fetch(API_BASE + '/api/admin/users'));
                managedUsers = data.users || [];
                renderUsers();
            } catch (error) {
                document.getElementById('users-loading').textContent = '加载失败：' + error.message;
            }
        }

        function renderUsers() {
            const body = document.getElementById('users-table-body');
            body.innerHTML = managedUsers.map(user => {
                const roleClass = user.role === 'admin' ? 'badge-admin' : 'badge-member';
                const activeClass = user.is_active ? 'badge-active' : 'badge-disabled';
                const canManage = currentUser.username === 'admin' || user.role !== 'admin';
                const actions = canManage
                    ? `<button class="ds-btn ds-btn-ghost" type="button" onclick="openEditUserModal('${user.id}')">修改</button>
                       <button class="ds-btn ds-btn-ghost" type="button" onclick="resetUserPassword('${user.id}')">重置密码</button>`
                    : '<span class="muted">仅内置 admin 可管理</span>';
                return `<tr>
                    <td><strong>${escapeHtml(user.display_name)}</strong></td>
                    <td><code>${escapeHtml(user.username)}</code></td>
                    <td><span class="badge ${roleClass}">${user.role === 'admin' ? '管理员' : '普通用户'}</span></td>
                    <td><span class="badge ${activeClass}">${user.is_active ? '启用' : '停用'}</span></td>
                    <td>${escapeHtml((user.updated_at || '').replace('T', ' ').slice(0, 19))}</td>
                    <td style="white-space:nowrap">
                        ${actions}
                    </td>
                </tr>`;
            }).join('');
            document.getElementById('users-loading').classList.add('hidden');
            document.getElementById('users-table-wrap').classList.remove('hidden');
        }

        function openCreateUserModal() {
            document.getElementById('user-modal-title').textContent = '新增用户';
            document.getElementById('edit-user-id').value = '';
            document.getElementById('edit-username').value = '';
            document.getElementById('edit-username').readOnly = false;
            document.getElementById('edit-display-name').value = '';
            document.getElementById('edit-role').value = 'member';
            document.getElementById('edit-active').value = 'true';
            document.getElementById('edit-active-field').classList.add('hidden');
            document.getElementById('user-edit-modal').classList.remove('hidden');
        }

        function openEditUserModal(userId) {
            const user = managedUsers.find(item => item.id === userId);
            if (!user) return;
            document.getElementById('user-modal-title').textContent = '修改用户';
            document.getElementById('edit-user-id').value = user.id;
            document.getElementById('edit-username').value = user.username;
            document.getElementById('edit-username').readOnly = true;
            document.getElementById('edit-display-name').value = user.display_name;
            document.getElementById('edit-role').value = user.role;
            document.getElementById('edit-active').value = String(Boolean(user.is_active));
            document.getElementById('edit-active-field').classList.remove('hidden');
            document.getElementById('user-edit-modal').classList.remove('hidden');
        }

        function closeUserModal() {
            document.getElementById('user-edit-modal').classList.add('hidden');
        }

        async function saveUser(event) {
            event.preventDefault();
            const userId = document.getElementById('edit-user-id').value;
            const payload = {
                display_name: document.getElementById('edit-display-name').value.trim(),
                role: document.getElementById('edit-role').value
            };
            let url = API_BASE + '/api/admin/users';
            let method = 'POST';
            if (userId) {
                url += '/' + encodeURIComponent(userId);
                method = 'PATCH';
                payload.is_active = document.getElementById('edit-active').value === 'true';
            } else {
                payload.username = document.getElementById('edit-username').value.trim().toLowerCase();
            }
            const button = document.getElementById('save-user-btn');
            button.disabled = true;
            try {
                const data = await readJson(await fetch(url, {
                    method,
                    headers: {'Content-Type': 'application/json', 'X-AiTicket-CSRF': '1'},
                    body: JSON.stringify(payload)
                }));
                closeUserModal();
                await loadUsers();
                showToast(userId ? '用户资料已更新' : '用户已创建', 'success');
                if (data.temporary_password) showTemporaryPassword(data.temporary_password);
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                button.disabled = false;
            }
        }

        async function resetUserPassword(userId) {
            const user = managedUsers.find(item => item.id === userId);
            const username = user ? user.username : '该用户';
            if (!confirm(`确认重置 ${username} 的登录密码？该用户现有会话会立即失效。`)) return;
            try {
                const data = await readJson(await fetch(
                    API_BASE + '/api/admin/users/' + encodeURIComponent(userId) + '/reset-password',
                    {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json', 'X-AiTicket-CSRF': '1'},
                        body: JSON.stringify({confirm: true})
                    }
                ));
                showTemporaryPassword(data.temporary_password);
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        function showTemporaryPassword(password) {
            document.getElementById('temporary-password').textContent = password;
            document.getElementById('password-result-modal').classList.remove('hidden');
        }

        function closePasswordModal() {
            document.getElementById('temporary-password').textContent = '';
            document.getElementById('password-result-modal').classList.add('hidden');
        }

        async function copyTemporaryPassword() {
            const password = document.getElementById('temporary-password').textContent;
            try {
                await navigator.clipboard.writeText(password);
                showToast('密码已复制', 'success');
            } catch (error) {
                showToast('浏览器未允许复制，请手动选择密码', 'warning');
            }
        }

        initializeSettings();
    </script>
    <script src="/assets/nav.js"></script>
    <script src="/assets/ds/theme.js"></script>
    <script src="/assets/ds/sidebar.js"></script>
    <script src="/assets/ds/command-palette.js"></script>
</body>
</html>
