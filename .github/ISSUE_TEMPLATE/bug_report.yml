name: Bug 报告
description: 报告一个问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "感谢提交 Bug！请尽可能填写以下信息。"
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述 Bug 是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现该问题？
      placeholder: |
        1. 进入 ...
        2. 点击 ...
        3. 看到错误 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 粘贴相关日志或截图（可选）
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "例如：v0.1.0 或 git commit hash"
